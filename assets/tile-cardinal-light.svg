<svg xmlns="http://www.w3.org/2000/svg" width="430" height="220" viewBox="0 0 430 220" role="img" aria-label="Cardinal: A geography guessing game where every guess gives back a distance and a compass bearing. 37 modes across 9 families.">
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}@keyframes blink{50%{opacity:0}}@keyframes pulse{50%{opacity:.3}}.blink{animation:blink 1.1s step-end infinite}.pulse{animation:pulse 2.4s ease-in-out infinite}@media (prefers-reduced-motion:reduce){.blink,.pulse{animation:none}}</style>
<rect x=".5" y=".5" width="429" height="219" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<text x="24" y="48" font-size="22" fill="#1f2328" font-weight="800">Cardinal</text>
<rect x="290" y="29" width="116" height="22" rx="11" fill="#1a7f37" fill-opacity=".12" stroke="#1a7f37" stroke-opacity=".45"/>
<circle cx="302" cy="40" r="3.5" fill="#1a7f37" class="pulse"/><text class="m" x="311" y="44" font-size="11" fill="#1a7f37">live · 220 ms</text>
<text class="m" x="24" y="72" font-size="12" fill="#59636e">find the hidden place</text>
<text x="24" y="106" font-size="14" fill="#1f2328">A geography guessing game where every guess gives</text>
<text x="24" y="126" font-size="14" fill="#1f2328">back a distance and a compass bearing. 37 modes</text>
<text x="24" y="146" font-size="14" fill="#1f2328">across 9 families.</text>
<rect x="24" y="168" width="49" height="24" rx="6" fill="#f6f8fa" stroke="#d0d7de"/><text class="m" x="34" y="184" font-size="12" fill="#1f2328">Vite</text>
<rect x="81" y="168" width="56" height="24" rx="6" fill="#f6f8fa" stroke="#d0d7de"/><text class="m" x="91" y="184" font-size="12" fill="#1f2328">React</text>
<rect x="145" y="168" width="92" height="24" rx="6" fill="#f6f8fa" stroke="#d0d7de"/><text class="m" x="155" y="184" font-size="12" fill="#1f2328">TypeScript</text>
<rect x="245" y="168" width="78" height="24" rx="6" fill="#f6f8fa" stroke="#d0d7de"/><text class="m" x="255" y="184" font-size="12" fill="#1f2328">Supabase</text>
</svg>
