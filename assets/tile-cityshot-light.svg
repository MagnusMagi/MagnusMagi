<circle cx="249" cy="40" r="3.5" fill="#0969da"/><text class="m" x="258" y="44" font-size="11" fill="#0969da">iphone · in the works</text>
<text class="m" x="24" y="72" font-size="12" fill="#59636e">photo routes timed to the light</text>
<text x="24" y="106" font-size="14" fill="#1f2328">Plans a walking route through a city&#39;s best photo</text>
<text x="24" y="126" font-size="14" fill="#1f2328">spots and tells you the minute to be at each one</text>
