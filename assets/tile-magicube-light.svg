<svg xmlns="http://www.w3.org/2000/svg" width="430" height="220" viewBox="0 0 430 220" role="img" aria-label="MagiCube: A Node.js webmail client for Mailcow or any IMAP/SMTP server. No database, push mail over IMAP IDLE.">
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}@keyframes blink{50%{opacity:0}}@keyframes pulse{50%{opacity:.3}}.blink{animation:blink 1.1s step-end infinite}.pulse{animation:pulse 2.4s ease-in-out infinite}@media (prefers-reduced-motion:reduce){.blink,.pulse{animation:none}}</style>
<rect x=".5" y=".5" width="429" height="219" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<text x="24" y="48" font-size="22" fill="#1f2328" font-weight="800">MagiCube</text>
<rect x="263" y="29" width="143" height="22" rx="11" fill="#0969da" fill-opacity=".12" stroke="#0969da" stroke-opacity=".45"/>
<circle cx="275" cy="40" r="3.5" fill="#0969da"/><text class="m" x="284" y="44" font-size="11" fill="#0969da">open source · mit</text>
<text class="m" x="24" y="72" font-size="12" fill="#59636e">self-hosted webmail</text>
<text x="24" y="106" font-size="14" fill="#1f2328">A Node.js webmail client for Mailcow or any</text>
<text x="24" y="126" font-size="14" fill="#1f2328">IMAP/SMTP server. No database, push mail over IMAP</text>
<text x="24" y="146" font-size="14" fill="#1f2328">IDLE.</text>
<rect x="24" y="168" width="78" height="24" rx="6" fill="#f6f8fa" stroke="#d0d7de"/><text class="m" x="34" y="184" font-size="12" fill="#1f2328">React 19</text>
<rect x="110" y="168" width="71" height="24" rx="6" fill="#f6f8fa" stroke="#d0d7de"/><text class="m" x="120" y="184" font-size="12" fill="#1f2328">Express</text>
<rect x="189" y="168" width="100" height="24" rx="6" fill="#f6f8fa" stroke="#d0d7de"/><text class="m" x="199" y="184" font-size="12" fill="#1f2328">Tailwind v4</text>
<rect x="297" y="168" width="49" height="24" rx="6" fill="#f6f8fa" stroke="#d0d7de"/><text class="m" x="307" y="184" font-size="12" fill="#1f2328">IMAP</text>
</svg>
