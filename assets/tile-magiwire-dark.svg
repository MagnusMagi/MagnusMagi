<svg xmlns="http://www.w3.org/2000/svg" width="430" height="220" viewBox="0 0 430 220" role="img" aria-label="MagiWire: Reads public RSS feeds every 30 minutes, rewrites each item with gpt-4o-mini and publishes it in Turkish, English and Estonian.">
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}@keyframes blink{50%{opacity:0}}@keyframes pulse{50%{opacity:.3}}.blink{animation:blink 1.1s step-end infinite}.pulse{animation:pulse 2.4s ease-in-out infinite}@media (prefers-reduced-motion:reduce){.blink,.pulse{animation:none}}</style>
<rect x=".5" y=".5" width="429" height="219" rx="12" fill="#0d1117" stroke="#30363d"/>
<text x="24" y="48" font-size="22" fill="#e6edf3" font-weight="800">MagiWire</text>
<rect x="263" y="29" width="143" height="22" rx="11" fill="#4493f8" fill-opacity=".12" stroke="#4493f8" stroke-opacity=".45"/>
<circle cx="275" cy="40" r="3.5" fill="#4493f8"/><text class="m" x="284" y="44" font-size="11" fill="#4493f8">open source · mit</text>
<text class="m" x="24" y="72" font-size="12" fill="#9198a1">ai news wire</text>
<text x="24" y="106" font-size="14" fill="#e6edf3">Reads public RSS feeds every 30 minutes, rewrites</text>
<text x="24" y="126" font-size="14" fill="#e6edf3">each item with gpt-4o-mini and publishes it in</text>
<text x="24" y="146" font-size="14" fill="#e6edf3">Turkish, English and Estonian.</text>
<rect x="24" y="168" width="92" height="24" rx="6" fill="#161b22" stroke="#30363d"/><text class="m" x="34" y="184" font-size="12" fill="#e6edf3">Next.js 16</text>
<rect x="124" y="168" width="78" height="24" rx="6" fill="#161b22" stroke="#30363d"/><text class="m" x="134" y="184" font-size="12" fill="#e6edf3">Supabase</text>
<rect x="210" y="168" width="64" height="24" rx="6" fill="#161b22" stroke="#30363d"/><text class="m" x="220" y="184" font-size="12" fill="#e6edf3">OpenAI</text>
</svg>
