<circle cx="275" cy="40" r="3.5" fill="#0969da"/><text class="m" x="284" y="44" font-size="11" fill="#0969da">open source · mit</text>
<text class="m" x="24" y="72" font-size="12" fill="#59636e">quit every app at once</text>
<text x="24" y="106" font-size="14" fill="#1f2328">A menu bar app that quits or force quits every</text>
<text x="24" y="126" font-size="14" fill="#1f2328">running app in one click, with per-app rules and</text>
<text x="24" y="146" font-size="14" fill="#1f2328">Auto Quit for idle apps.</text>
