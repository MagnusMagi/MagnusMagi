<rect x="88" y="168" width="71" height="24" rx="6" fill="#f6f8fa" stroke="#d0d7de"/><text class="m" x="98" y="184" font-size="12" fill="#1f2328">SwiftUI</text>
<rect x="167" y="168" width="64" height="24" rx="6" fill="#f6f8fa" stroke="#d0d7de"/><text class="m" x="177" y="184" font-size="12" fill="#1f2328">AppKit</text>
<rect x="239" y="168" width="64" height="24" rx="6" fill="#f6f8fa" stroke="#d0d7de"/><text class="m" x="249" y="184" font-size="12" fill="#1f2328">Carbon</text>
